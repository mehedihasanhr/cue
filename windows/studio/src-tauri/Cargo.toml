[package]
name = "cue-studio"
version = "0.1.0"
description = "Cue Studio for Windows"
authors = ["Md. Mehedi Hasan Hridoy"]
edition = "2024"

[lib]
name = "cue_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = { version = "~2.13", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
log = "0.4.34"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
hound = "3.5.1"
trash = "5.2.9"
mp4 = "0.14"

[target.'cfg(windows)'.dependencies]
windows-capture = { path = "vendor/windows-capture" }
wasapi = "0.26.0"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_Graphics_Dwm",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
