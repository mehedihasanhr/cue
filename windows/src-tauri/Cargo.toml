[package]
name = "klik"
version = "0.2.2"
description = "Klik for Windows"
authors = ["Md. Mehedi Hasan Hridoy"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = { version = "0.9.8", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
trash = "5.2.9"
anyhow = "1.0.104"
log = "0.4.34"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.3"
urlencoding = "2.1.3"
tauri-plugin-notification = "2.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-updater = { version = "~2.13", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Media_Audio", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
